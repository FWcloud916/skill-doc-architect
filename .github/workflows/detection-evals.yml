# Detection eval sweep — see evals/README.md for contract, cost, and security notes.
#
# Manual-trigger ONLY. Each provider call costs real API spend, so this workflow has
# no push, pull_request, or schedule trigger. Choose anthropic, openai, or both; each
# provider records and grades its own results against the same checked-in contract.
#
# Required repository secrets depend on the selected provider:
# - ANTHROPIC_API_KEY for anthropic/both
# - OPENAI_API_KEY for openai/both (passed only to openai/codex-action)
name: Detection evals

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to run. 'both' executes independent jobs in parallel."
        required: true
        default: "anthropic"
        type: choice
        options:
          - anthropic
          - openai
          - both
      runs:
        description: "Runs per fixture (N). All runs must pass."
        required: true
        default: "3"
        type: string
      filter:
        description: "Optional fixture substring, e.g. basic-rails."
        required: false
        default: ""
        type: string
      anthropic_model:
        description: "Claude model passed to the Anthropic runner."
        required: true
        default: "claude-sonnet-5"
        type: string
      openai_model:
        description: "OpenAI model passed to Codex Action."
        required: true
        default: "gpt-5.6-luna"
        type: string
      openai_effort:
        description: "Reasoning effort for the OpenAI model."
        required: true
        default: "medium"
        type: choice
        options:
          - low
          - medium
          - high

concurrency:
  group: detection-evals-${{ inputs.provider }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      selected: ${{ steps.config.outputs.selected }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate inputs and build fixture matrix
        id: config
        env:
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
          INPUT_OPENAI_MODEL: ${{ inputs.openai_model }}
          INPUT_OPENAI_EFFORT: ${{ inputs.openai_effort }}
        run: |
          python3 evals/scripts/detection_ci.py prepare \
            --fixtures "$GITHUB_WORKSPACE/evals/fixtures" \
            --runs "$INPUT_RUNS" \
            --filter "$INPUT_FILTER" \
            --provider "$INPUT_PROVIDER" \
            --anthropic-model "$INPUT_ANTHROPIC_MODEL" \
            --openai-model "$INPUT_OPENAI_MODEL" \
            --openai-effort "$INPUT_OPENAI_EFFORT" \
            --github-output "$GITHUB_OUTPUT"

  anthropic:
    if: ${{ inputs.provider == 'anthropic' || inputs.provider == 'both' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install skill for Claude Code
        run: |
          mkdir -p ~/.claude/skills
          ln -s "$GITHUB_WORKSPACE/skills/doc-architect" ~/.claude/skills/doc-architect

      - name: Run Anthropic detection sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CLI: claude
          MODEL: ${{ inputs.anthropic_model }}
        run: |
          ./evals/scripts/run_detection.sh \
            "$GITHUB_WORKSPACE/evals/results/ci-anthropic" \
            "${{ inputs.runs }}" \
            "${{ inputs.filter }}"

      - name: Upload Anthropic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-anthropic-results
          path: evals/results/ci-anthropic/
          if-no-files-found: warn

  openai:
    if: ${{ inputs.provider == 'openai' || inputs.provider == 'both' }}
    needs: prepare
    name: OpenAI — ${{ matrix.fixture }} — run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Render shared detection prompt
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          mkdir -p .github/codex/runtime "evals/results/openai/$FIXTURE"
          python3 evals/scripts/detection_prompt.py \
            "$GITHUB_WORKSPACE/evals/fixtures/$FIXTURE" \
            "$GITHUB_WORKSPACE/skills/doc-architect/SKILL.md" \
            > .github/codex/runtime/detection-prompt.md

      - name: Run OpenAI detection
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.openai_model }}
          effort: ${{ inputs.openai_effort }}
          prompt-file: ${{ github.workspace }}/.github/codex/runtime/detection-prompt.md
          working-directory: ${{ github.workspace }}/evals/fixtures/${{ matrix.fixture }}
          output-schema-file: ${{ github.workspace }}/evals/detection-report.schema.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-version: "0.144.2"
          output-file: ${{ github.workspace }}/evals/results/openai/${{ matrix.fixture }}/run-${{ matrix.run }}.json
          codex-args: '["--ephemeral"]'

      - name: Upload OpenAI matrix result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-openai-${{ matrix.fixture }}-run-${{ matrix.run }}
          path: evals/results/openai/
          if-no-files-found: warn

  openai-grade:
    if: ${{ always() && (inputs.provider == 'openai' || inputs.provider == 'both') }}
    needs:
      - prepare
      - openai
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download OpenAI matrix results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: detection-openai-*
          path: evals/results/ci-openai/
          merge-multiple: true

      - name: Write OpenAI manifest
        env:
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_MODEL: ${{ inputs.openai_model }}
          INPUT_EFFORT: ${{ inputs.openai_effort }}
        run: |
          python3 evals/scripts/detection_ci.py manifest \
            --fixtures "$GITHUB_WORKSPACE/evals/fixtures" \
            --runs "$INPUT_RUNS" \
            --filter "$INPUT_FILTER" \
            --provider openai \
            --model "$INPUT_MODEL" \
            --effort "$INPUT_EFFORT" \
            --results "$GITHUB_WORKSPACE/evals/results/ci-openai"

      - name: Grade OpenAI detection sweep
        run: python3 evals/scripts/grade.py evals/results/ci-openai

      - name: Upload aggregate OpenAI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-openai-results
          path: evals/results/ci-openai/
          if-no-files-found: warn
