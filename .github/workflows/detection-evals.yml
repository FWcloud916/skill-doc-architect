# Detection eval sweep — see evals/README.md for what this tests and why.
#
# Manual-trigger ONLY (workflow_dispatch). Deliberately no push/pull_request/
# schedule trigger: each run drives the doc-architect skill live via the
# claude CLI against 32 fixtures, which costs real API spend (~$16 for a
# default N=3 run — see the cost note in evals/README.md). A human must click
# "Run workflow" for that to happen.
#
# Requires: an ANTHROPIC_API_KEY repo secret (Settings -> Secrets and
# variables -> Actions). The "model" dispatch input defaults to claude-sonnet-5
# and should always be set explicitly to SOME model — never leave the CLI's
# unpinned default in a bare-API-key environment; see the evals/README.md
# cost note for why that's unpredictable and can be pricier.
name: Detection evals

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per fixture (N). Suite default is 3 (all-runs-must-pass)."
        required: false
        default: "3"
      filter:
        description: "Optional fixture name substring, e.g. basic-rails, for a cheap single-fixture debug run."
        required: false
        default: ""
      model:
        description: "Model to pin (never leave the CLI default in a bare-API-key env — unpredictable and can be pricier). See evals/README.md cost note."
        required: false
        default: "claude-sonnet-5"

concurrency:
  group: detection-evals
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install skill (symlink checkout into ~/.claude/skills)
        run: |
          mkdir -p ~/.claude/skills
          ln -s "$GITHUB_WORKSPACE/skills/doc-architect" ~/.claude/skills/doc-architect

      - name: Run detection sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          ./evals/scripts/run_detection.sh \
            "$GITHUB_WORKSPACE/evals/results/ci" \
            "${{ inputs.runs }}" \
            "${{ inputs.filter }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-eval-results
          path: evals/results/ci/
          if-no-files-found: warn
